<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #111;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: white;
        border-radius: 16px;
        padding: 24px;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>This app has been installed and can be opened offline.</p>
      <p>Please reconnect to refresh content.</p>
    </div>
  </body>
</html>
